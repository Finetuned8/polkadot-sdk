.codecov-check:finetuned8 
  script:
    - > 
      if command -v codecovcli -h >/dev/null 2>&1; then
        codecovcli --version;
      else
        echo "downloading codecovcli";
        curl -s -o codecovcli https://cli.codecov.io/latest/linux/codecov;
        chmod +x codecovcli;
        mv codecovcli /usr/local/bin/codecovcli;
      fi
